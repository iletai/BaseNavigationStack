name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Package for Release
        run: swift build -c release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
