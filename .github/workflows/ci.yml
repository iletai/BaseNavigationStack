name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          brew update
          brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --strict --quiet

  test-macos:
    name: macOS Tests (Swift ${{ matrix.swift }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Tests
        run: swift test --enable-code-coverage -v

  test-ios:
    name: iOS Simulator Tests
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run iOS Simulator Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -o -E "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          echo "Selected simulator ID: $SIM_ID"
          if [ -n "$SIM_ID" ]; then
            xcodebuild test \
              -scheme BaseNavigationStack \
              -destination "id=$SIM_ID" \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No iPhone simulator found, testing with generic platform"
            xcodebuild build \
              -scheme BaseNavigationStack \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          fi
