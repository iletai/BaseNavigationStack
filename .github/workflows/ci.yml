name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**', 'hotfix/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: 0.65.1

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          curl -sSL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: swiftlint --strict --quiet

  test-macos:
    name: macOS Tests
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Tests
        run: swift test --enable-code-coverage

  test-ios:
    name: iOS Simulator Tests
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run iOS Simulator Tests
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -o -E "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          if [ -z "$SIM_ID" ]; then
            echo "::error::No iPhone simulator available"
            exit 1
          fi
          echo "Selected simulator ID: $SIM_ID"
          xcodebuild test \
            -scheme BaseNavigationStack \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

  build-platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS, watchOS, visionOS]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Package
        run: |
          xcodebuild build \
            -scheme BaseNavigationStack \
            -destination "generic/platform=${{ matrix.platform }}" \
            CODE_SIGNING_ALLOWED=NO

  build-example:
    name: Build Example App
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Example
        run: |
          xcodebuild build \
            -project NavigationStackExample/NavigationStackExample.xcodeproj \
            -scheme NavigationStackExample \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ui-tests-example:
    name: Example UI Tests
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run UI Tests On Newest iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.split(".iOS-")[1].split("-")])
          for runtime in reversed(runtimes):
              phones = [d["udid"] for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0])
                  break
          ')
          if [ -z "$SIM_ID" ]; then
            echo "::error::No iPhone simulator available"
            exit 1
          fi
          xcodebuild test \
            -project NavigationStackExample/NavigationStackExample.xcodeproj \
            -scheme NavigationStackExample \
            -destination "id=$SIM_ID" \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Result Bundle (screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-ui-tests-xcresult
          path: UITests.xcresult
          if-no-files-found: ignore

  binary-size:
    name: Binary Size
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Library Binary Size Budget
        run: scripts/check-binary-size.sh 80000
